services:
  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      STOCKPULSE_CORS_ORIGINS: http://localhost:8080
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
