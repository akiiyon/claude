name: stockpulse

on:
  push:
    paths: ["stockpulse/**", ".github/workflows/stockpulse.yml"]
  pull_request:
    paths: ["stockpulse/**", ".github/workflows/stockpulse.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpulse/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          STOCKPULSE_PROVIDER: simulated

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockpulse/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stockpulse/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
